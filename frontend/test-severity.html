<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
  <h2>Severity Badge Test</h2>
  <div class="space-y-4 mt-4">
    <div>
      <span class="px-2 py-1 text-xs font-semibold rounded border bg-orange-500 text-white border-orange-600">high</span>
      <span class="ml-2 text-sm">HIGH (current)</span>
    </div>
    <div>
      <span class="px-2 py-1 text-xs font-semibold rounded border bg-orange-400 text-white border-orange-500">high</span>
      <span class="ml-2 text-sm">HIGH (alternative - lighter)</span>
    </div>
    <div>
      <span class="px-2 py-1 text-xs font-semibold rounded border bg-orange-600 text-white border-orange-700">high</span>
      <span class="ml-2 text-sm">HIGH (alternative - darker)</span>
    </div>
  </div>
</body>
</html>
